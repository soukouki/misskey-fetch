[package]
name = "misskey-fetch"
version = "0.1.0"
edition = "2024"

[dependencies]
chrono = "0.4.45"
chrono-tz = "0.10.4"
reqwest = { version = "0.13.5", features = ["json"] }
rmcp = { version = "3.5.1", features = ["transport-io"] }
schemars = "1.2.3"
serde = "1.0.229"
serde_json = "1.0.154"
thiserror = "2.0.21"
tokio = { version = "1.53.3", features = ["macros", "rt-multi-thread", "time"] }

[dev-dependencies]
wiremock = "0.6.5"
