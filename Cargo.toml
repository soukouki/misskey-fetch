[package]
name = "misskey-fetch"
version = "0.1.0"
edition = "2024"

[dependencies]
chrono = { version = "0.4.45", features = ["serde"] }
chrono-tz = "0.10.4"
reqwest = { version = "0.13.5", features = ["json"] }
rmcp = { version = "3.5.1", features = ["transport-io"] }
schemars = "1.2.3"
serde = "1.0.229"
serde_json = "1.0.154"
thiserror = "2.0.21"
idna = "1.1.0"
tokio = { version = "1.53.3", features = ["macros", "rt-multi-thread", "time", "net", "sync"] }
bytes = "1.12.1"
http = "1.5.0"
http-body = "1.1.0"
http-body-util = "0.1.5"
hyper = { version = "1.12.0", features = ["http1", "server"] }
hyper-util = { version = "0.1.21", features = ["http1", "server", "tokio"] }
uuid = { version = "1.28.0", features = ["v4"] }

[dev-dependencies]
wiremock = "0.6.5"
